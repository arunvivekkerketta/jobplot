name: Deploy

# Images are published only after the CI workflow on main reports success, which
# is what `workflow_run` + the conclusion guard below enforce: a failing or
# cancelled CI run leaves this workflow skipped, not failed. workflow_dispatch
# allows republishing a known-good commit by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ matrix.name }} image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            target: web
          - name: worker
            target: worker
    steps:
      - name: Check out the commit CI verified
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      # Container registry paths must be lowercase; github.repository keeps the
      # case the repository was created with, so it is folded here.
      - name: Resolve image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.prefix }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summarise
        run: |
          {
            echo "### ${{ matrix.name }} image"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`${{ github.event.workflow_run.head_sha || github.sha }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| tags | ${{ steps.meta.outputs.tags }} |"
          } >> "$GITHUB_STEP_SUMMARY"
